[project]
name = "snaplearn-backend"
version = "0.1.0"
description = "SnapLearn — AI-powered vocabulary learning backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "psycopg2-binary>=2.9.11",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "httpx>=0.28.0",
    "Pillow>=11.0.0",
    "imagehash>=4.3.0",
    "python-multipart>=0.0.18",
    "structlog>=24.4.0",
    "apscheduler>=3.10.0",
    "baml-py==0.220.0",
    "openai>=2.29.0",
    "elevenlabs>=1.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
auto-migrate = "scripts.auto_migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
