networks:
  snaplearn-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  backend_tts_cache:
    driver: local
  backend_logs:
    driver: local
